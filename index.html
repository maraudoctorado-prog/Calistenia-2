<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#13251f"><link rel="manifest" href="manifest.webmanifest"><title>Calistenia 45</title><style>:root{font-family:system-ui,Arial;background:#f4f6f3;color:#17241e}*{box-sizing:border-box}body{margin:0}header{background:#13251f;color:white;padding:24px 18px 22px}header h1{margin:0;font-size:26px}header p{opacity:.8;margin:5px 0}main{max-width:720px;margin:auto;padding:16px 16px 90px}.card{background:white;border:1px solid #dfe5df;border-radius:16px;padding:17px;margin-bottom:14px;box-shadow:0 2px 9px #17241e08}h2{font-size:20px;margin:0 0 12px}h3{font-size:16px;margin:12px 0 5px}.muted{color:#5c6b63;font-size:14px}.pill{display:inline-block;background:#e3ede7;color:#234b36;border-radius:99px;padding:5px 10px;font-size:12px;font-weight:650}.warn{background:#fff4dd;border-color:#e9ce93}.danger{background:#fff0ed;border-color:#e6b1a9}button{border:0;border-radius:11px;background:#216b4d;color:white;font:inherit;font-weight:650;padding:12px 15px;cursor:pointer}button.secondary{background:#e7ede9;color:#234635}button:disabled{opacity:.4;cursor:not-allowed}button.small{padding:7px 10px;font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #dde4df;display:flex;justify-content:space-around;padding:8px 4px max(8px,env(safe-area-inset-bottom))}nav button{background:transparent;color:#53675a;font-size:12px;padding:9px 8px}nav button.active{background:#e3ede7;color:#1e6347}.hidden{display:none!important}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{padding:12px;background:#f2f6f2;border-radius:12px}.stat b{display:block;font-size:22px}input,select,textarea{width:100%;border:1px solid #cbd6cf;border-radius:9px;padding:10px;font:inherit;background:white;color:#17241e;margin:5px 0 12px}label{font-size:14px;font-weight:600}input[type=checkbox]{width:auto;margin:0 8px 0 0}ul{padding-left:22px}li{margin:6px 0}.exercise{border-top:1px solid #e7ece8;padding:14px 0}.exercise:first-child{border-top:0}.timer{font-size:40px;font-weight:700;font-variant-numeric:tabular-nums}.meter{height:9px;border-radius:99px;background:#e2e8e3;overflow:hidden}.meter div{height:100%;background:#23875b}details{margin-top:8px}summary{cursor:pointer;color:#216b4d;font-weight:600}.notice{font-size:13px;line-height:1.5}svg{max-width:100%} .figure{width:100%;max-width:280px;background:#f1f5f1;border-radius:12px;padding:10px;margin-top:9px}.figure svg{width:100%;height:140px} .figure line,.figure circle{stroke:#285b44;stroke-width:5;fill:none;stroke-linecap:round} .figure .equipment{stroke:#9aab9e;stroke-width:7} .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.tabs button{font-size:13px}.tabs button.selected{background:#163f2d}</style></head><body><header><h1>Calistenia 45</h1><p>Tu entrenamiento, paso a paso</p></header><main><section id="home"></section><section id="workouts" class="hidden"></section><section id="library" class="hidden"></section><section id="progress" class="hidden"></section><section id="settings" class="hidden"></section></main><nav id="nav"><button data-tab="home" class="active">Inicio</button><button data-tab="workouts">Sesiones</button><button data-tab="library">Ejercicios</button><button data-tab="progress">Progreso</button><button data-tab="settings">Seguridad</button></nav><script>
const KEY='calistenia45-v1';const initial={weight:94,height:183,age:45,waist:'',week:1,clearance:false,backPain:false,kneeIssue:false,log:[],metrics:[],session:null};let state;try{state={...initial,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{state={...initial}};let tab='home',timerInterval=null,timerSeconds=0,selectedDay=0;
const exercises=[{id:'walk',name:'Caminata cómoda en terreno plano',type:'cardio',level:'Inicial',instructions:['Elegí una superficie plana y estable.','Caminá a ritmo que permita hablar cómodamente.','Detenete ante dolor, inestabilidad o bloqueo.'],caution:'No continuar si la rodilla cede, se traba o duele.',video:'https://www.youtube.com/results?search_query=tecnica+caminar+ejercicio+principiantes'},{id:'bike',name:'Bicicleta fija muy suave',type:'cardio',level:'Inicial, si es tolerada',instructions:['Ajustá el asiento para evitar una flexión excesiva de rodilla.','Pedaleá sentado, con resistencia mínima y sin inclinar excesivamente la espalda.','Probá 3 a 5 minutos inicialmente; no fuerces ante molestias.'],caution:'Si aparece dolor rotuliano, enganche o molestia dorsal, interrumpí.',video:'https://www.youtube.com/results?search_query=ajuste+altura+sillin+bicicleta+estatica+principiantes'},{id:'breath',name:'Respiración tranquila y postura cómoda',type:'suave',level:'Inicial',instructions:['Sentate en una silla firme, con apoyo y espalda cómoda.','Respirá suavemente, sin contener el aire ni forzar la amplitud.','Realizá de 1 a 2 minutos sin buscar fatiga.'],caution:'No es un tratamiento específico para el dolor dorsal.',video:'https://www.youtube.com/results?search_query=respiracion+diafragmatica+sentado+fisioterapia'},{id:'chair',name:'Sentarse y levantarse de una silla',type:'fuerza',level:'Tras evaluación',instructions:['Usá una silla estable contra una pared.','Con pies apoyados, levantate lentamente sin dejar caer las rodillas hacia dentro.','Empezá con pocas repeticiones y rango cómodo.'],caution:'No realizar hasta evaluación profesional de rodilla y espalda.',video:'https://www.youtube.com/results?search_query=sit+to+stand+exercise+physical+therapy'},{id:'wall',name:'Flexiones contra pared',type:'fuerza',level:'Tras evaluación',instructions:['Apoyá las manos sobre una pared a la altura del pecho.','Mantené el tronco alineado sin arquear la espalda.','Flexioná y extendé los codos con control y sin dolor.'],caution:'No iniciar si reproduce el dolor dorsal; requiere evaluación previa.',video:'https://www.youtube.com/results?search_query=wall+push+up+exercise+beginner+physical+therapy'},{id:'curl',name:'Curl de bíceps con mancuernas de 2 kg',type:'fuerza',level:'Tras evaluación',instructions:['Sentate con la espalda apoyada y una mancuerna en cada mano.','Flexioná los codos sin balancear el tronco.','Bajá lentamente y respirá de forma natural.'],caution:'Detener ante molestias en espalda u hombros.',video:'https://www.youtube.com/results?search_query=seated+dumbbell+bicep+curl+proper+form'},{id:'heel',name:'Elevaciones de talones con apoyo',type:'fuerza',level:'Tras evaluación',instructions:['Sostenete en una superficie firme.','Elevá los talones lentamente, sin inclinar el cuerpo.','Descendé con control y detenete ante inestabilidad.'],caution:'No comenzar sin valorar rodilla y estabilidad.',video:'https://www.youtube.com/results?search_query=supported+heel+raises+physiotherapy'}];
const schedule=[{title:'Día A · Actividad suave',items:[['walk','10 min'],['breath','2 min']]},{title:'Día B · Actividad suave',items:[['walk','10–12 min'],['breath','2 min']]},{title:'Día C · Actividad suave',items:[['walk','12–15 min'],['breath','2 min']]}];const strength=[{title:'Día A · Fuerza inicial',items:[['walk','5 min'],['wall','1 × 5–8'],['chair','1 × 5–8'],['curl','1 × 6–8']]},{title:'Día B · Cardio y técnica',items:[['bike','5–10 min'],['breath','2 min'],['heel','1 × 6–8']]},{title:'Día C · Fuerza inicial',items:[['walk','5 min'],['chair','1 × 5–8'],['wall','1 × 5–8'],['curl','1 × 6–8']]}];
function save(){localStorage.setItem(KEY,JSON.stringify(state))}function el(id){return document.getElementById(id)}function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function button(text,action,secondary=false){return `<button class="${secondary?'secondary':''}" onclick="${action}">${text}</button>`}function switchTab(t){tab=t;document.querySelectorAll('main>section').forEach(s=>s.classList.toggle('hidden',s.id!==t));document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render();scrollTo(0,0)}document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>switchTab(b.dataset.tab)));
function render(){renderHome();renderWorkouts();renderLibrary();renderProgress();renderSettings()}
function renderHome(){let completed=state.log.length;el('home').innerHTML=`<div class="card"><span class="pill">Semana ${state.week} de 12 · ${state.clearance?'Preparación supervisada':'Fase 0: adaptación'}</span><h2 style="margin-top:12px">Empezamos desde cero</h2><p>Objetivos: bajar grasa corporal, desarrollar fuerza y mejorar condición cardiovascular sin forzar la rodilla ni la espalda.</p><div class="grid"><div class="stat"><span class="muted">Peso de partida</span><b>94 kg</b></div><div class="stat"><span class="muted">Sesiones registradas</span><b>${completed}</b></div></div><div class="actions">${button('Ver mis sesiones',"switchTab('workouts')")}</div></div><div class="card warn"><h2>Antes de entrenar</h2><p class="notice">Antecedente de hiperflexión traumática de rodilla derecha en 2012, sin bloqueo referido desde hace más de un año; dolor dorsal recurrente al levantar peso. Se recomienda evaluación clínica presencial antes de ejercicios de fuerza. La aplicación no diagnostica ni reemplaza atención médica.</p><p class="notice">Si aparece dolor, bloqueo, inestabilidad o empeoramiento de síntomas, detené la sesión. Si surge debilidad progresiva, alteraciones de esfínteres, dolor torácico o falta de aire intensa, buscá atención urgente.</p></div><div class="card"><h2>Tu recorrido</h2><div class="meter"><div style="width:${Math.min(100,(state.week/12)*100)}%"></div></div><p class="muted">Semanas 1–4: adaptación · 5–8: fuerza básica · 9–12: consolidación. Las fases son orientativas y no se habilitan automáticamente.</p></div>`}
function renderWorkouts(){let plans=state.clearance?strength:schedule;let p=plans[selectedDay];el('workouts').innerHTML=`<div class="card"><h2>Mis tres días</h2><p class="muted">Elegí días no consecutivos, por ejemplo lunes, miércoles y viernes.</p><div class="tabs">${['Día A','Día B','Día C'].map((x,i)=>`<button class="${i===selectedDay?'selected':'secondary'}" onclick="selectedDay=${i};renderWorkouts()">${x}</button>`).join('')}</div><h3>${p.title}</h3>${p.items.map(([id,dose])=>{let x=exercises.find(e=>e.id===id);return `<div class="exercise"><b>${x.name}</b><p class="muted">${dose} · <a href="#" onclick="showExercise('${id}');return false">Ver instrucciones</a></p></div>`}).join('')}<div class="actions">${button('Iniciar sesión',`startSession(${selectedDay})`)}</div></div><div id="sessionBox"></div><div class="card"><h2>Temporizador</h2><div class="timer" id="clock">00:00</div><div class="actions">${button('Iniciar', 'startTimer()')}${button('Pausar','stopTimer()',true)}${button('Reiniciar','resetTimer()',true)}</div></div>`;updateClock();renderSession()}
function startSession(i){const pain=confirm('CONTROL DE SEGURIDAD\n\n¿Hoy NO tenés dolor dorsal nuevo o creciente, dolor de rodilla, bloqueo, sensación de que cede, mareos ni otros síntomas preocupantes?\n\nAceptar = sin síntomas. Cancelar = hay síntomas o no estás seguro.');if(!pain){alert('No inicies la sesión. Consultá a un profesional si los síntomas persisten, empeoran o te preocupan.');return}state.session={day:i,started:new Date().toISOString(),checked:[],notes:''};save();renderSession()}
function renderSession(){const s=state.session,box=el('sessionBox');if(!box)return;if(!s){box.innerHTML='';return}let p=(state.clearance?strength:schedule)[s.day];box.innerHTML=`<div class="card"><h2>Sesión en curso</h2><p class="muted">Marcá únicamente lo que completaste sin molestias.</p>${p.items.map(([id,dose],i)=>{let e=exercises.find(e=>e.id===id);return `<div class="exercise"><label><input type="checkbox" ${s.checked.includes(i)?'checked':''} onchange="toggleExercise(${i},this.checked)">${esc(e.name)} · ${dose}</label><details><summary>Cómo se hace</summary><ol>${e.instructions.map(x=>`<li>${esc(x)}</li>`).join('')}</ol><p class="muted">${esc(e.caution)}</p></details></div>`}).join('')}<label>Notas o molestias</label><textarea id="sessionNotes" rows="2" placeholder="Anotá cómo te sentiste">${esc(s.notes)}</textarea><div class="actions">${button('Guardar sesión', 'finishSession()')}${button('Cancelar','cancelSession()',true)}</div></div>`}
function toggleExercise(i,v){let a=new Set(state.session.checked);v?a.add(i):a.delete(i);state.session.checked=[...a];save()}function finishSession(){state.session.notes=el('sessionNotes').value;state.log.push({...state.session,ended:new Date().toISOString()});state.session=null;save();render();alert('Sesión guardada en este dispositivo.')}function cancelSession(){if(confirm('¿Cancelar esta sesión?')){state.session=null;save();renderSession()}}
function showExercise(id){switchTab('library');let d=el('ex-'+id);if(d){d.open=true;d.scrollIntoView({behavior:'smooth',block:'start'})}}
function diagram(id){let common='<circle cx="75" cy="28" r="12"/><line x1="75" y1="40" x2="75" y2="89"/><line x1="75" y1="89" x2="55" y2="129"/><line x1="75" y1="89" x2="95" y2="129"/>';let arms=id==='curl'?'<line x1="75" y1="51" x2="45" y2="65"/><line x1="45" y1="65" x2="55" y2="43"/><line x1="75" y1="51" x2="105" y2="65"/><line x1="105" y1="65" x2="95" y2="43"/>':id==='wall'?'<line x1="75" y1="50" x2="113" y2="50"/><line x1="113" y1="50" x2="136" y2="68"/><line class="equipment" x1="146" y1="8" x2="146" y2="136"/>':'<line x1="75" y1="50" x2="48" y2="77"/><line x1="75" y1="50" x2="102" y2="77"/>';return `<div class="figure" role="img" aria-label="Esquema ilustrativo simplificado; consultar instrucciones detalladas"><svg viewBox="0 0 190 150">${common}${arms}<line class="equipment" x1="30" y1="137" x2="160" y2="137"/></svg><div class="muted">Esquema orientativo, no demostración técnica completa.</div></div>`}
function renderLibrary(){el('library').innerHTML=`<div class="card"><h2>Biblioteca de ejercicios</h2><p class="muted">Instrucciones básicas, precauciones y búsqueda de demostraciones externas. Los enlaces son búsquedas de videos, no videos revisados ni certificados.</p>${exercises.map(x=>`<details id="ex-${x.id}" class="exercise"><summary>${esc(x.name)} <span class="pill">${esc(x.level)}</span></summary>${diagram(x.id)}<ol>${x.instructions.map(s=>`<li>${esc(s)}</li>`).join('')}</ol><p class="notice"><b>Precaución:</b> ${esc(x.caution)}</p><a href="${x.video}" target="_blank" rel="noopener noreferrer">Buscar demostraciones en video ↗</a></details>`).join('')}</div>`}
function renderProgress(){let latest=state.metrics.at(-1);el('progress').innerHTML=`<div class="card"><h2>Registrar medidas</h2><p class="muted">Una medición semanal, en condiciones similares, es suficiente.</p><label>Peso actual (kg)</label><input id="weight" type="number" min="30" max="250" step="0.1" value="${esc(latest?.weight??state.weight)}"><label>Perímetro de cintura (cm, opcional)</label><input id="waist" type="number" min="40" max="200" step="0.1" value="${esc(latest?.waist??state.waist)}">${button('Guardar medición','saveMetric()')}</div><div class="card"><h2>Historial de medidas</h2>${state.metrics.length?state.metrics.slice().reverse().map(m=>`<p>${new Date(m.date).toLocaleDateString('es-AR')} · <b>${m.weight} kg</b> ${m.waist?'· cintura '+m.waist+' cm':''}</p>`).join(''):'<p class="muted">Todavía no registraste medidas.</p>'}</div><div class="card"><h2>Sesiones completadas</h2>${state.log.length?state.log.slice().reverse().map(l=>`<p>${new Date(l.ended).toLocaleDateString('es-AR')} · Día ${['A','B','C'][l.day]} · ${l.checked.length} ejercicios ${l.notes?'· '+esc(l.notes):''}</p>`).join(''):'<p class="muted">Todavía no hay sesiones registradas.</p>'}</div>`}
function saveMetric(){let w=Number(el('weight').value),wa=el('waist').value;if(!Number.isFinite(w)||w<30||w>250||wa&&(Number(wa)<40||Number(wa)>200)){alert('Revisá las medidas ingresadas.');return}state.weight=w;state.waist=wa;state.metrics.push({date:new Date().toISOString(),weight:w,waist:wa});save();renderProgress()}
function renderSettings(){el('settings').innerHTML=`<div class="card warn"><h2>Reglas de seguridad</h2><ul><li>Consulta médica o de fisioterapia para valorar dolor dorsal recurrente y antecedente traumático de rodilla antes de comenzar fuerza.</li><li>No hacer dominadas, sentadillas profundas, saltos ni cargas pesadas inicialmente.</li><li>Detener el ejercicio ante dolor, enganche, inestabilidad, mareos o dificultad respiratoria anormal.</li><li>Ante debilidad progresiva, alteración de esfínteres, dolor torácico o síntomas intensos, buscar atención urgente.</li></ul></div><div class="card"><h2>Habilitación de fuerza</h2><p class="muted">Activá esta opción solamente después de recibir una evaluación presencial favorable y recomendaciones sobre qué movimientos son apropiados. Esta confirmación no reemplaza la consulta.</p><label><input type="checkbox" ${state.clearance?'checked':''} onchange="setClearance(this.checked)">Recibí evaluación profesional y autorización para iniciar fuerza adaptada.</label></div><div class="card"><h2>Datos y copia de seguridad</h2><p class="muted">Los datos se guardan solo en el navegador de este dispositivo. Si borrás los datos del navegador, podrías perderlos. Exportá una copia periódicamente.</p><div class="actions">${button('Exportar mis datos','exportData()')}${button('Importar copia','document.getElementById(\'importFile\').click()',true)}</div><input id="importFile" type="file" accept="application/json" onchange="importData(this.files[0])" style="display:none"></div><div class="card"><h2>Información del programa</h2><p class="muted">Programa educativo de 12 semanas, no terapia ni consejo médico individual. El contenido de fuerza es un ejemplo preliminar que debe adaptarse según evaluación clínica. La semana no avanza automáticamente.</p><label>Semana del programa (1–12)</label><input type="number" id="week" min="1" max="12" value="${state.week}">${button('Actualizar semana','updateWeek()',true)}</div>`}
function setClearance(v){if(v&&!confirm('¿Confirmás que un profesional evaluó tus molestias y autorizó ejercicios de fuerza adaptados?')){renderSettings();return}state.clearance=v;save();render()}function updateWeek(){let n=Number(el('week').value);if(!Number.isInteger(n)||n<1||n>12)return alert('Elegí una semana entre 1 y 12.');state.week=n;save();render()}function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='calistenia45-respaldo.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function importData(f){if(!f)return;try{let d=JSON.parse(await f.text());if(!Array.isArray(d.log)||!Array.isArray(d.metrics))throw Error('Formato incorrecto');if(!confirm('¿Reemplazar los registros actuales por esta copia?'))return;state={...initial,...d,session:null};save();render();alert('Copia importada')}catch{alert('Archivo de respaldo no válido')}}function updateClock(){let c=el('clock');if(c)c.textContent=String(Math.floor(timerSeconds/60)).padStart(2,'0')+':'+String(timerSeconds%60).padStart(2,'0')}function startTimer(){if(timerInterval)return;timerInterval=setInterval(()=>{timerSeconds++;updateClock()},1000)}function stopTimer(){clearInterval(timerInterval);timerInterval=null}function resetTimer(){stopTimer();timerSeconds=0;updateClock()}render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
